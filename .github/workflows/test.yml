name: CI - clone app and test execution on

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PORT: 6007
      VITE_API_URL: http://localhost:6007/api

    steps:
      - name: checkout actuality repo
        uses: actions/checkout@v3

      - name: clone repo athenea
        run: |
          git clone https://github.com/Atenea-Conocimientos/redux-athena-bank.git app

      - name: create .env file backend
        run: |
          echo "MONGO_URI=${{ env.MONGO_URI }}" >> app/backend/.env
          echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> app/backend/.env
          echo "PORT=${{ env.PORT }}" >> app/backend/.env
          echo "VITE_API_URL=${{ env.VITE_API_URL }}" >> app/backend/.env

      - name: install dependencies backend
        run: |
          cd app/backend
          npm install

      - name: Construct backend
        run: |
          cd app/backend
          npm run dev > backend.log 2>&1 &

      - name: install wait-on
        run: |
          npm install -g wait-on

      - name: Backend
        run: wait-on tcp:6007

      - name: install dependencies frontend
        run: |
          cd app/frontend
          npm install
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Construct frontend
        run: |
          cd app/frontend
          npm run dev -- --host 0.0.0.0 > frontend.log 2>&1 &
          wait-on http://localhost:3000